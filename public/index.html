<!-- Neko: gatinho interativo -->
<div id="neko-pet" aria-label="Gatinho interativo" role="button" tabindex="0">
  <div id="neko-bubble">Nyaa! 🐾</div>
  <div id="neko-cat">
    <div class="neko-ears">
      <span class="neko-ear"></span>
      <span class="neko-ear"></span>
    </div>
    <div class="neko-face">
      <span class="neko-eye">•</span>
      <span class="neko-eye">•</span>
      <span class="neko-nose">♥</span>
      <span class="neko-mouth">ᴗ</span>
      <span class="neko-whiskers left">≋</span>
      <span class="neko-whiskers right">≋</span>
    </div>
    <div class="neko-body">🐾</div>
  </div>
</div>

<style>
  #neko-pet {
    position: fixed;
    right: 14px;
    bottom: 14px;
    width: 94px;
    z-index: 9999;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    text-align: center;
    font-family: system-ui, sans-serif;
  }

  #neko-pet * { box-sizing: border-box; }

  #neko-bubble {
    display: none;
    margin-bottom: 7px;
    padding: 7px 10px;
    border: 1px solid #f3b7d7;
    border-radius: 14px;
    background: #fff0f8;
    color: #a52b70;
    font-size: 12px;
    font-weight: 700;
    box-shadow: 0 3px 12px #0002;
  }

  #neko-pet.talking #neko-bubble {
    display: inline-block;
    animation: neko-pop .25s ease-out;
  }

  #neko-cat {
    position: relative;
    width: 82px;
    height: 91px;
    margin: auto;
    filter: drop-shadow(0 4px 5px #0003);
    animation: neko-float 3s ease-in-out infinite;
  }

  .neko-ears {
    position: absolute;
    top: 4px;
    left: 12px;
    width: 58px;
    display: flex;
    justify-content: space-between;
  }

  .neko-ear {
    width: 26px;
    height: 30px;
    background: #ffcae4;
    border: 3px solid #a94779;
    border-radius: 12px 12px 4px 4px;
    transform: rotate(-12deg);
  }

  .neko-ear + .neko-ear {
    transform: rotate(12deg);
  }

  .neko-face {
    position: absolute;
    top: 18px;
    left: 5px;
    width: 72px;
    height: 57px;
    background: #fff0f8;
    border: 3px solid #a94779;
    border-radius: 45% 45% 48% 48%;
  }

  .neko-eye {
    position: absolute;
    top: 17px;
    left: 17px;
    color: #66314d;
    font-size: 23px;
    line-height: 14px;
    font-weight: 900;
  }

  .neko-eye + .neko-eye {
    left: 43px;
  }

  .neko-nose {
    position: absolute;
    top: 29px;
    left: 31px;
    color: #e76ca9;
    font-size: 10px;
  }

  .neko-mouth {
    position: absolute;
    top: 34px;
    left: 29px;
    color: #a94779;
    font-size: 13px;
    font-weight: bold;
  }

  .neko-whiskers {
    position: absolute;
    top: 27px;
    color: #d77cac;
    font-size: 15px;
    letter-spacing: -4px;
  }

  .neko-whiskers.left { left: -10px; }
  .neko-whiskers.right { right: -6px; }

  .neko-body {
    position: absolute;
    bottom: 0;
    left: 25px;
    width: 32px;
    height: 27px;
    border-radius: 15px 15px 8px 8px;
    background: #ffcae4;
    border: 3px solid #a94779;
    color: #a94779;
    font-size: 15px;
    line-height: 22px;
  }

  #neko-pet.petted .neko-ear {
    animation: neko-ear-wiggle .35s ease-in-out 2;
  }

  #neko-pet.petted .neko-eye {
    animation: neko-blink .35s ease-in-out;
  }

  @keyframes neko-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes neko-pop {
    from { transform: scale(.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes neko-ear-wiggle {
    0%, 100% { rotate: 0deg; }
    50% { rotate: -13deg; }
  }

  @keyframes neko-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: .15; }
  }

  @media (prefers-reduced-motion: reduce) {
    #neko-cat { animation: none; }
    #neko-pet * { transition: none !important; }
  }
</style>

<script>
(() => {
  const pet = document.getElementById('neko-pet');
  if (!pet || pet.dataset.ready) return;
  pet.dataset.ready = 'true';

  const bubble = document.getElementById('neko-bubble');
  const messages = [
    'Nyaa! 🐾',
    'Oi, humano! 💗',
    'Vamos baixar? 😺',
    'Miau miau!',
    'Você é legal! 🌸'
  ];
  let hideTimer;

  function petCat() {
    bubble.textContent = messages[Math.floor(Math.random() * messages.length)];
    pet.classList.remove('petted', 'talking');
    void pet.offsetWidth;
    pet.classList.add('petted', 'talking');

    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      pet.classList.remove('talking', 'petted');
    }, 2200);
  }

  pet.addEventListener('click', petCat);
  pet.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      petCat();
    }
  });
})();
</script>
