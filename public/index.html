    * { box-sizing: border-box; }

    :root {
      --pink: #e778b2;
      --pink-dark: #d65b9e;
      --ink: #353b4a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: #fff7fa;
      background-image: radial-gradient(#f5c9dc 1.5px, transparent 1.5px);
      background-size: 32px 32px;
      animation: background-drift 18s linear infinite;
    }

    header {
      background: rgba(255,255,255,.96);
      border-radius: 0 0 30px 30px;
      padding: 20px 18px;
      box-shadow: 0 5px 25px #edbfd21c;
      animation: header-in .8s ease both;
    }

    .top {
      max-width: 760px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: clamp(19px,4.5vw,28px);
      font-weight: 850;
      color: #e45eaa;
      animation: brand-glow 3s ease-in-out infinite;
    }

    .pill {
      border: 1px solid #f6dce9;
      background: #fff2f8;
      color: #d65b9e;
      border-radius: 30px;
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      animation: pill-float 3s ease-in-out infinite;
    }

    main {
      width: min(620px,calc(100% - 28px));
      margin: 34px auto;
    }

    .panel {
      position: relative;
      overflow: hidden;
      text-align: center;
      background: rgba(255,255,255,.97);
      border: 1px solid white;
      border-radius: 32px;
      padding: 34px clamp(18px,5vw,42px);
      box-shadow: 0 15px 45px #eab9d51c;
      animation: panel-in .8s .1s ease both;
    }

    .flower {
      position: absolute;
      right: 0;
      top: 0;
      background: #fff0f7;
      border-radius: 0 0 0 65px;
      padding: 14px;
      font-size: 29px;
      transform-origin: top right;
      animation: flower-sway 4s ease-in-out infinite;
    }

    .insta {
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      width: 76px;
      height: 76px;
      border: 1px solid #f9edf3;
      border-radius: 25px;
      color: #e779b7;
      font-size: 43px;
      box-shadow: 0 3px 6px #00000008;
      animation: icon-bob 3s ease-in-out infinite;
    }

      font-size: clamp(25px,5vw,35px);
      margin: 0 0 12px;
      animation: text-in .7s .2s both;
    }
